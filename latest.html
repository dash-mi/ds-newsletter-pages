<h1>מעדכנת את גיליון 586 — מטמיעה את התמונה שהעלית</h1>
<p>ראיתי שהגשת שוב את הגיליון עם תמונה חדשה. שאר התוכן (הכתבות, קטע הדעה, המכתב האישי) לא השתנה, אז אני רק מחליפה את התמונה ובונה מחדש. זה אמור לקחת דקה־שתיים.</p>
