<h1>מעבדת את גיליון 190 — מתקנת את הלוגו הראשי</h1>
<p>קיבלנו את בקשת התיקון "הלוגו מעוות, תסדר אותו". מתקנת את יחס הגובה-רוחב של הלוגו הראשי בתבנית ובונה מחדש את הגיליון.</p>
<div class="box">
  <h2>מה לעשות עכשיו</h2>
